name: Label drift gate

# Fails if the live GitHub label set diverges from .github/labels.json (issue
# #21, Gap 4). labels.json is the source of truth; scripts/sync_labels.py check
# compares the two name sets and exits non-zero on any difference. The check is
# read-only and the paired `sync` is additive, so this gate never deletes a
# label -- it reports drift for a human to reconcile (audio-lab retains GitHub's
# stock labels by decision). Runs when labels.json changes, on any label
# create/edit/delete, and on demand.
#
# Decided 2026-07-28 (#30 Gap 3, ratified at spec launch): stays post-merge BY
# DESIGN -- this gate detects drift, it does not prevent it. Neither trigger below
# sees a pull request, so a PR editing labels.json is never checked before it
# merges; the `push` trigger only fires once the change has already landed on
# main. A pre-merge `pull_request` check was the alternative and was rejected: it
# would add a networked gate to every PR touching labels.json to close a
# minutes-wide, main-only drift window, and that cost outweighs the risk here.
# Revisit only if drift actually reaches main uncaught in practice, not on
# principle.
on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
  label:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: label-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check labels.json against the live set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gh reads the token from GH_TOKEN and the repo from GH_REPO, so the
      # `gh label list` in the script needs no -R and no interactive auth.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare declared labels to the live label set
        run: python3 scripts/sync_labels.py check
