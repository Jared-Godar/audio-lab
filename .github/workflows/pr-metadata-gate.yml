name: PR metadata gate

# Mechanical enforcement of the PR-metadata rules in AGENTS.md (issue #21,
# Gap 9): at least one `type:` and one `area:` label, every label declared in
# .github/labels.json, and an assignee. It reads the PR's live state, so a
# metadata edit re-evaluates on the events below. Deliberately does NOT require
# a milestone or a `Closes #N` link — governance PRs here are legitimately
# unmilestoned and may Ref rather than Close an issue (see the script header).
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - assigned
      - unassigned

permissions:
  contents: read
  pull-requests: read

# cancel-in-progress MUST stay false: this is a REQUIRED status check. The gate
# fires on an event burst at PR creation (opened + labeled + assigned…). With
# cancel-in-progress:true, each new event cancelled the prior in-flight run,
# leaving a `cancelled` conclusion on the required "PR metadata" context — which
# GitHub branch protection treats as unsatisfied, hanging the merge box at
# "Expected — waiting for status" even though a later run passed. Serializing
# with cancel:false lets every run complete; the latest is a real pass/fail.
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR metadata
        # PR number crosses in via env, never inline expression interpolation.
        run: python3 scripts/check_pr_metadata.py --pr-number "$PR_NUMBER"
