version: 2

# Keep the SHA-pinned GitHub Actions current (issue #5). Monthly is deliberately
# low-noise; the uv/pip ecosystems are intentionally NOT enabled — two small
# subprojects would generate more PRs than value at this stage (recorded in #5).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    # Group every github-actions bump into ONE PR per cycle instead of one PR
    # per action (issue #28). Without this, #26 and #27 arrived as two separate
    # blocked PRs where a single grouped PR was intended.
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "type: automation"
      - "area: governance"
    # The PR-metadata gate (scripts/check_pr_metadata.py) requires an assignee;
    # Dependabot silently skips unknown assignees, so this must be a real login.
    assignees:
      - "Jared-Godar"
