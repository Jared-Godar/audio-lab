AWSTemplateFormatVersion: "2010-09-09"

# NOTE: this template uses CloudFormation's LONG-FORM intrinsic functions
# (Ref:, Fn::Sub, Fn::Equals, Fn::If) rather than the !Ref / !Sub short tags.
# Long form is plain YAML, so the repo's generic check-yaml pre-commit hook can
# parse it; the short-tag form uses custom YAML tags (!Equals, ...) that a safe
# YAML loader cannot construct. Both forms are equally valid CloudFormation.
#
# NOTE: the Description below is capped at 1024 characters by CloudFormation
# (cfn-lint E1003 and validate-template both reject a longer one), so detail
# that would overflow it lives in comments at the resources instead.

Description: >-
  DNS RecordSets for toldstraight.com, managed INSIDE a pre-existing Route 53
  hosted zone. This stack never creates or owns the hosted zone: the zone was
  auto-created when the domain was registered through Route 53 (2026-07-26) and
  is wired to the registrar's nameservers. If a stack owned the zone,
  delete-stack would destroy it, and recreating it mints four NEW NS records
  that no longer match what the registrar publishes -- taking the domain dark
  until the nameservers are repointed by hand. The zone is therefore an INPUT
  (HostedZoneId parameter), never a Resource. See infra/README.md.

  Scope is mail plus a certificate-issuer restriction. Mail was a hard lockdown
  (SPF "-all", RFC 7505 null MX); as of #54 the domain hosts mailboxes at
  iCloud+, so MX accepts iCloud, SPF authorizes iCloud and only iCloud, and
  Apple's DKIM selector is delegated by CNAME. DMARC stays p=reject with STRICT
  alignment and CAA is untouched. Site records (apex + vote) are gated OFF.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      The id of the EXISTING hosted zone for the domain (auto-created at
      registration). Console: Route 53 -> Hosted zones -> select the domain ->
      View details -> the Hosted zone details panel shows Hosted zone ID. This
      template manages records inside this zone and must never create the zone.

  DomainName:
    Type: String
    Default: toldstraight.com
    AllowedPattern: "^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\\.[A-Za-z0-9-]{1,63})+$"
    Description: The apex domain name, without a trailing dot.

  DeploySiteRecords:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Gate for the apex and vote site records. Leave "false" until there is a
      real target to point at (a CloudFront distribution, load balancer, or IP).
      Set "true" AND supply ApexTarget / VoteTarget to switch the site on.

  ApexTarget:
    Type: String
    Default: ""
    Description: >-
      Deploy-time target for the apex A record, supplied only when
      DeploySiteRecords is "true". An IPv4 address. Do NOT invent one. When the
      apex should point at CloudFront, replace the ApexSiteRecord below with an
      A-record AliasTarget block (apex CNAMEs are invalid DNS) -- CloudFront has
      no stable IP.

  VoteTarget:
    Type: String
    Default: ""
    Description: >-
      Deploy-time target hostname for vote.<domain> (a CNAME), supplied only
      when DeploySiteRecords is "true". Do NOT invent one.

Conditions:
  # Default false: the stack deploys with security records only. Flip
  # DeploySiteRecords to "true" (and supply the *Target params) to add the site.
  SiteRecordsEnabled:
    Fn::Equals:
      - Ref: DeploySiteRecords
      - "true"

Resources:
  # --- Mail: iCloud+ Custom Email Domain (#54) ------------------------------
  # This domain previously declared that it neither sends nor accepts mail
  # (SPF "-all" + RFC 7505 null MX, #22). It now hosts mailboxes at iCloud+,
  # so those two records are deliberately given up. What is NOT given up:
  # DMARC stays p=reject with STRICT alignment and CAA is untouched. Only
  # iCloud is authorized to send, and anything else claiming to be this domain
  # is still rejected by DMARC policy.
  #
  # Note that SPF now ends "~all" (softfail), NOT "-all" -- forced by Apple's
  # verifier, see the SpfRecord comment below. DMARC is where the enforcement
  # lives; do not read "~all" as the domain having gone soft.
  #
  # TTL 300 on every record this change touches (was 3600). The null MX said
  # "this domain accepts no mail", so a resolver that cached it could keep
  # bouncing mail for a full hour after cutover. 300 makes the cutover
  # observable and a rollback fast. Raising them back to 3600 once mail is
  # confirmed working is a deliberate follow-up, not part of #54.
  #
  # Apple's setup screen offers to write these records into Route 53 itself.
  # That offer is declined by decision: the zone's records are owned by this
  # template, and joint ownership between a provider and CloudFormation is
  # exactly the drift infra/README.md exists to prevent. The VALUES below were
  # read off Apple's screen; the records are published only from here.

  # Both apex TXT values live in ONE RecordSet ON PURPOSE. Route 53 addresses a
  # record set by (name, type), so an apex TXT can only ever be a single
  # resource holding multiple strings -- authoring the SPF policy and Apple's
  # domain-verification token as two AWS::Route53::RecordSet resources would
  # collide on the same name+type and fail the stack. So this resource is really
  # "the apex TXT record set", not "the SPF record".
  #
  # THE LOGICAL ID IS DELIBERATELY NOT RENAMED, despite now being inaccurate.
  # A CloudFormation logical ID cannot be renamed: changing it is a delete of
  # the old resource plus a create of the new one. Measured on this stack --
  # renaming SpfRecord -> ApexTxtRecords produced "Add ApexTxtRecords" +
  # "Remove SpfRecord", both against physical resource toldstraight.com, i.e.
  # CloudFormation would create the new apex TXT and then issue a DELETE
  # against the live one in its cleanup phase. That risks taking SPF and
  # Apple's verification token off the domain together. Keeping the id makes
  # the change a clean in-place Modify. An honest comment costs nothing; an
  # honest identifier would cost a live DNS record.
  #   - v=spf1 include:icloud.com ~all
  #       *** "~all" IS MANDATORY HERE. DO NOT "IMPROVE" IT TO "-all". ***
  #       Apple's Custom Email Domain verifier does a LITERAL STRING COMPARISON
  #       against the SPF value it issued -- it does not evaluate SPF
  #       semantics. Apple issues "~all", so "-all" can NEVER pass verification
  #       however long you wait, and the failure message blames your record
  #       ("Check your SPF record -- make sure the settings you updated match
  #       the ones sent to you") rather than naming the mismatch.
  #
  #       This was tried the strong way first and it failed: "-all" is
  #       semantically stricter and is what a security review would ask for,
  #       which is exactly why someone will eventually change it back. Doing so
  #       un-verifies the domain at Apple and breaks mail at a moment nobody is
  #       watching. Measured 2026-07-27 -- caching was excluded as a cause, the
  #       new record was confirmed live on both the authoritative nameserver
  #       and public resolvers before Apple was retried.
  #
  #       The security cost is bounded and is NOT where the enforcement lives:
  #       DMARC below is p=reject with strict alignment and is unchanged. The
  #       "~all" vs "-all" difference only reaches receivers doing an SPF-only
  #       check with no DMARC lookup; for those, spoofed mail moves from hard
  #       reject to softfail. Against DMARC-aware receivers, everything #22
  #       bought is intact.
  #   - apple-domain=...
  #       Apple's domain-ownership verification token. Removing it can
  #       un-verify the domain at Apple; it is not decoration.
  SpfRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "${DomainName}."
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - '"v=spf1 include:icloud.com ~all"'
        - '"apple-domain=5J9Dq1Hh4Tnuwc0B"'

  # Inbound mail: iCloud's two mail exchangers, equal priority 10. This
  # replaces the RFC 7505 null MX ("0 .") that previously declared the domain
  # accepts no mail. Trailing dots are load-bearing -- without them Route 53
  # would append the zone name and point mail at a host that does not exist.
  #
  # The logical id NullMxRecord is kept for the same reason SpfRecord is (see
  # above): renaming it would delete and re-create a live MX record instead of
  # modifying it. The name is now historical -- read the values, not the id.
  NullMxRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "${DomainName}."
      Type: MX
      TTL: "300"
      ResourceRecords:
        - "10 mx01.mail.icloud.com."
        - "10 mx02.mail.icloud.com."

  # DKIM: Apple signs outbound mail with selector "sig1" and publishes the key
  # on its own infrastructure, so this is a CNAME delegation rather than a key
  # published here -- Apple can rotate the key without a change-set. The target
  # embeds this domain name by design; it is not a copy-paste error.
  #
  # This record is what makes DMARC survivable. Alignment is STRICT
  # (adkim=s; aspf=s) and DMARC passes on EITHER aligned SPF or aligned DKIM.
  # MEASURED 2026-07-27 (maintainer's two-directional mail test, #54/#59): BOTH
  # paths align — iCloud uses the custom domain as the envelope sender, so the
  # result was dkim=pass + spf=pass + dmarc=pass under p=REJECT with alignment
  # strict and unrelaxed. That measurement is why relaxing adkim/aspf on a
  # failure would be the wrong fix: the one observed failure was Apple's DKIM
  # key-publication lag (transient, self-resolving), not misalignment.
  DkimRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "sig1._domainkey.${DomainName}."
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - Fn::Sub: "sig1.dkim.${DomainName}.at.icloudmailadmin.com."

  # DMARC: reject anything failing alignment, strictly, for the domain and its
  # subdomains. UNCHANGED by #54 -- this is the anti-spoofing guarantee that
  # survives the mail cutover, and relaxing alignment to adkim=r/aspf=r is a
  # decision to be made on evidence from a FAILED test, by the maintainer, not
  # pre-emptively.
  #
  # rua= (aggregate reports) added 2026-07-30 (#59, maintainer decision):
  # enforcement without telemetry fails silently and expensively, and a
  # same-domain rua target needs no cross-domain "_report._dmarc" authorization
  # record. Reports arrive at hello@ as gzipped XML, one per receiver per day;
  # nothing parses them yet (see infra/README.md). ruf= (per-message forensic
  # reports) stays omitted DELIBERATELY: low receiver adoption, and reports can
  # contain message content.
  DmarcRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "_dmarc.${DomainName}."
      Type: TXT
      TTL: "3600"
      ResourceRecords:
        - '"v=DMARC1; p=reject; sp=reject; adkim=s; aspf=s; rua=mailto:hello@toldstraight.com;"'

  # --- Certificate issuance restriction ------------------------------------
  # CAA: only Amazon (ACM) may issue certificates for this domain, wildcard or
  # not. iodef (a violation-report address) is omitted until the maintainer
  # supplies one. TTL 3600: stable security record.
  CaaRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "${DomainName}."
      Type: CAA
      TTL: "3600"
      ResourceRecords:
        - '0 issue "amazon.com"'
        - '0 issuewild "amazon.com"'

  # --- Site records (gated OFF by default) ---------------------------------
  # Authored so the site switches on without a template rewrite. TTL 300:
  # changeable. Targets come from parameters at enable-time -- this template
  # invents no IP and no CloudFront distribution.

  ApexSiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: SiteRecordsEnabled
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "${DomainName}."
      Type: A
      TTL: "300"
      ResourceRecords:
        - Ref: ApexTarget

  VoteSiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: SiteRecordsEnabled
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: "vote.${DomainName}."
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - Ref: VoteTarget

Outputs:
  ManagedZoneId:
    Description: The hosted zone these records were written into (an input, not created here).
    Value:
      Ref: HostedZoneId

  SecurityRecordsSummary:
    Description: The mail and security records this stack manages.
    Value:
      Fn::Sub: >-
        iCloud+ mail on ${DomainName} (MX mx01/mx02.mail.icloud.com, SPF
        include:icloud.com -all, DKIM selector sig1 delegated to Apple);
        DMARC p=reject with strict alignment; CAA restricting issuance to
        amazon.com

  SiteRecordsState:
    Description: Whether the apex/vote site records are deployed.
    Value:
      Fn::If:
        - SiteRecordsEnabled
        - "enabled"
        - "gated off (DeploySiteRecords=false)"
