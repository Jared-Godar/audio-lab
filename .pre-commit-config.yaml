minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
        # The 1024 KB gate stays for everything else — it is what catches an
        # accidental binary on a public repo. The one exclusion below is a
        # deliberate, maintainer-approved artifact (#68): a 7060x10700 type-specimen
        # contact sheet, 1229 KB, that is the visual evidence behind the typeface
        # decision. It cannot be downscaled without destroying its only purpose
        # (reading type at size), and re-encoding it makes it larger, not smaller.
        # Do not "fix" this by raising --maxkb — that weakens the gate everywhere to
        # admit one file. Add a path here instead, and say why.
        #
        # The second entry (#90) is the show-wide Archer-style cast portraits under
        # episodes/cast/portraits/. These are deliberate, maintainer-approved visual
        # deliverables (host identity + synthetic-character set), generated at 1:1 in
        # Google Gemini; the source PNGs run ~1.0–1.9 MB each and downscaling or
        # re-encoding degrades the approved art. Directory glob (not per-file) so the
        # re-runnable commit procedure admits Owen/Des/Voss/Anna and future portraits
        # without another gate edit. maxkb stays 1024 everywhere else.
        # The third entry (2026-08-02) is the finished episode masters. These are the
        # published artifacts -- the podcast audio and the YouTube video -- not working
        # renders, which stay in the gitignored output/ zone. Largest today is 15.7 MB,
        # well under GitHub's 100 MB ceiling. Directory-scoped glob so future episodes
        # need no gate edit. maxkb stays 1024 everywhere else; if a master ever passes
        # 75 MB, raise it with the maintainer rather than widening anything here.
        exclude: |
          (?x)^(
            brand/20260727-adobe-illustrator-toldstraight-type-shootout-contact-sheet\.png
            | episodes/cast/portraits/.*\.png
            | episodes/[^/]+/[^/]+\.(mp3|mp4)
          )$
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # Local guard against committing straight to main. CI skips this hook:
      # on the push-to-main trigger the checked-out ref legitimately IS main,
      # so it would fail unconditionally there. Branch protection is the
      # server-side enforcement; this is the fast local one.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        # prompts/ holds seed briefs preserved as written (immutable after
        # handoff); artifacts/ is gitignored scratch and never reaches CI.
        exclude: ^prompts/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  # Local gates. These are the #204 mechanism: the rules they enforce were already
  # written and already binding, and were broken anyway because enforcement depended
  # on an agent choosing to run a check. A hook does not choose.
  - repo: local
    hooks:
      # The maintainer's standing constraint — every face in the final design is in
      # the audio-lab Adobe library (project zol6gng); a face absent from it is
      # definitionally wrong — wired to something that fails. `ArialNarrow-Bold`
      # reached main in a builder marked IN FORCE and was caught by the maintainer
      # two merges later (#202); this blocks it at commit time instead.
      #
      # Reads brand/fonts-manifest.json only, so it needs no fonts installed and
      # behaves identically in CI, a cloud session and a fresh clone. Regenerate the
      # manifest with scripts/generate_fonts_manifest.py where the library is synced.
      - id: brand-fonts-in-library
        name: brand fonts are in the maintainer's Adobe library
        entry: python3 scripts/check_brand_fonts.py
        language: system
        pass_filenames: true
        files: ^(tools/brand/.*\.jsx|brand/.*\.md)$
