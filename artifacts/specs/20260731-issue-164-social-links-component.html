<!--
  Told Straight — social links component for site/index.html   (issue #164)
  Generated 2026-07-31. READY TO PASTE. Three blocks: CSS, MARKUP, SCRIPT.

  MARKS ARE THE OFFICIAL GLYPH GEOMETRY, not redrawn. Sourced from the Simple
  Icons project (CC0), which carries each platform's official path data. Brand
  colours are each platform's documented hex.

  CONTRAST — MEASURED, not assumed. WCAG floor for non-text graphics is 3.0:1.
      mark        colour     on #EDE9E0   on #14140F
      X           #000000       17.33        1.14   <-- NON-PERCEIVABLE on dark
      TikTok      #000000       17.33        1.14   <-- NON-PERCEIVABLE on dark
      Instagram   #FF0069        3.18        4.80
      YouTube     #FF0000        3.30        4.62
      Facebook    #0866FF        3.98        3.83

  So X and TikTok do NOT carry their brand colour. They inherit var(--ts-ink),
  which already flips #111111 -> #EDE9E0 with the theme, so they invert
  automatically and stay perceivable in both. The other three keep brand colour
  because both themes measure above the floor. This is the honest reading of
  "official full colour": every mark that CAN carry its brand colour does.

  DUPLICATION: the canonical markup lives in the FOOTER. The script clones it
  into the header. Same shape as the GO_LIVE constant already in this file, and
  for the same reason — two handles are scheduled to change (TikTok 2026-08-30,
  Facebook when a Page username is granted), so two hand-maintained copies would
  drift on the first edit.
-->

<!-- ============================ 1. CSS ============================
     Paste inside the existing <style> block. -->
<style>
.social{list-style:none;display:flex;gap:.15rem;margin:0;padding:0;align-items:center}
.social__link{display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;                      /* 44px hit area, glyph is 22 */
  border-radius:2px;text-decoration:none;
  transition:opacity .12s ease,background-color .12s ease}
.social__link:hover{opacity:.72}
.social__link:focus-visible{outline:2px solid var(--ts-red);outline-offset:2px}
.social__mark{width:22px;height:22px;fill:currentColor}
/* X and TikTok: brand colour is #000 and measures 1.14:1 on the dark stock.
   Inherit the ink token instead so they invert with the theme. */
.social__mark--ink{width:22px;height:22px;fill:var(--ts-ink)}
.social--header{margin-top:1.1rem}
@media(max-width:640px){.social{gap:0}.social__link{width:40px;height:40px}
  .social__mark,.social__mark--ink{width:20px;height:20px}}
</style>

<!-- ====================== 3. MARKUP — HEADER ======================
     Empty on purpose. Filled by the script below, so there is exactly ONE
     place to edit a URL. Insert after <div class="authority">…</div>,

<nav aria-label="Told Straight on social media, page header" id="social-header-slot"></nav>

<!-- ========================== 4. SCRIPT ===========================
     Paste into the existing <script> block. Mirrors the GO_LIVE pattern:
     one source of truth, rendered in two places, cannot disagree. -->
<script>
(function () {
  var src = document.getElementById('social-source');
  var slot = document.getElementById('social-header-slot');
  if (!src || !slot) return;                    // no-JS / partial: footer still works
  var copy = src.cloneNode(true);
  copy.removeAttribute('id');                   // ids must stay unique
  copy.classList.add('social--header');
  slot.appendChild(copy);
})();
</script>
